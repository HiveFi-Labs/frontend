<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <rect width="800" height="800" fill="url(#bgGradient)"/>
  
  <!-- Hexagon pattern background -->
  <pattern id="hexPattern" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
    <polygon points="30,0 60,15 60,37 30,52 0,37 0,15" fill="none" stroke="#FFD700" stroke-width="0.5" opacity="0.2"/>
  </pattern>
  <rect width="800" height="800" fill="url(#hexPattern)"/>
  
  <!-- Main bee body -->
  <ellipse cx="400" cy="400" rx="150" ry="180" fill="#FFD700"/>
  
  <!-- Bee stripes -->
  <rect x="250" y="340" width="300" height="30" fill="#333333"/>
  <rect x="250" y="390" width="300" height="30" fill="#333333"/>
  <rect x="250" y="440" width="300" height="30" fill="#333333"/>
  
  <!-- Wings -->
  <ellipse cx="280" cy="350" rx="80" ry="120" fill="url(#wingGradient)" opacity="0.8" transform="rotate(-20 280 350)"/>
  <ellipse cx="520" cy="350" rx="80" ry="120" fill="url(#wingGradient)" opacity="0.8" transform="rotate(20 520 350)"/>
  
  <!-- Head -->
  <circle cx="400" cy="280" r="80" fill="#FFD700"/>
  
  <!-- Eyes -->
  <circle cx="370" cy="270" r="20" fill="#333333"/>
  <circle cx="430" cy="270" r="20" fill="#333333"/>
  <circle cx="375" cy="265" r="8" fill="white"/>
  <circle cx="435" cy="265" r="8" fill="white"/>
  
  <!-- Antennae -->
  <path d="M380 240 Q370 200 360 180" stroke="#333333" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M420 240 Q430 200 440 180" stroke="#333333" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="360" cy="180" r="10" fill="#333333"/>
  <circle cx="440" cy="180" r="10" fill="#333333"/>
  
  <!-- Crown (for Genesis Pioneer) -->
  <path d="M350 200 L350 160 L370 180 L400 150 L430 180 L450 160 L450 200" fill="#9333EA" stroke="#7C3AED" stroke-width="3"/>
  <circle cx="400" cy="150" r="8" fill="#FFD700"/>
  
  <!-- Text -->
  <text x="400" y="650" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#FFD700">GENESIS PIONEER</text>
  <text x="400" y="700" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#9333EA">HiveFi Community</text>
  
  <!-- Decorative hexagon frame -->
  <polygon points="400,50 650,200 650,600 400,750 150,600 150,200" fill="none" stroke="#FFD700" stroke-width="4" opacity="0.6"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F0F"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <linearGradient id="wingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5E7EB" stop-opacity="0.9"/>
      <stop offset="100%" style="stop-color:#9CA3AF" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
</svg>